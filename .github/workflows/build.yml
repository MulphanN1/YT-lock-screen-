name: Build APK

on:
  push:
    paths-ignore:
      - "bauman/**"
      - ".github/workflows/bauman.yml"
  pull_request:
    paths-ignore:
      - "bauman/**"
      - ".github/workflows/bauman.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk YT-Fon.apk

      # Optional: fails when the account's Actions storage quota is full; the release below does not use it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: YT-Fon-apk
          path: YT-Fon.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT Фон (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: YT-Fon.apk
