name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional release key from repository secrets (see README). Without it the release
      # APK is signed with the committed debug key, as before.
      - name: Release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "RELEASE_STORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk YT-Fon.apk
          cp app/build/outputs/bundle/release/app-release.aab YT-Fon.aab

      # Shows in the log which key signed the APK (CN=Android Debug means the public debug key).
      - name: Signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs YT-Fon.apk | grep -E "DN|SHA-256"

      # Optional: fails when the account's Actions storage quota is full; the release below does not use it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: YT-Fon
          path: |
            YT-Fon.apk
            YT-Fon.aab

      # Builds from main become the latest release; other branches publish test pre-releases.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT Фон (сборка ${{ github.run_number }}${{ github.ref_name != 'main' && ', тестовая' || '' }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: |
            YT-Fon.apk
            YT-Fon.aab
